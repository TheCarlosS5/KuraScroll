services:
  kura-scroll:
    build:
      context: .
      dockerfile: Dockerfile
    image: kura-scroll:latest
    container_name: kura-scroll
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: 0.0.0.0
      PUBLIC_PLATFORM_MODE: "${PUBLIC_PLATFORM_MODE:-true}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      STORAGE_ROOT: /app/data/storage
      INCOMING_DIR: /app/data/storage/incoming
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env (openssl rand -hex 32)}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      KURA_CORS_ORIGINS: ${KURA_CORS_ORIGINS:-http://localhost:4000}
      REQUIRE_EMAIL_VERIFICATION: "${REQUIRE_EMAIL_VERIFICATION:-false}"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: "${SMTP_FROM:-KuraScroll <no-reply@kura-scroll.local>}"
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      MAX_PAGES_PER_CHAPTER: ${MAX_PAGES_PER_CHAPTER:-250}
      USER_QUOTA_GB: ${USER_QUOTA_GB:-5}
    volumes:
      - kura_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  kura_data:
    name: kura_scroll_data
